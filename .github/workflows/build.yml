name: Build executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Web Panel
        run: |
          pnpm --dir web-panel install
          pnpm --dir web-panel build
        shell: pwsh

      - name: Restore NuGet Packages
        run: nuget restore Wand-Enhancer.sln
        shell: pwsh

      - name: Build Release Executable
        run: msbuild Wand-Enhancer.sln /p:Configuration=Release
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer-exe
          path: WandEnhancer/bin/Release/WandEnhancer.exe
